spring.application.name=apptdea

# Puerto del servidor (configurable si el 8080 está ocupado)
server.port=${SERVER_PORT:8080}

# Orígenes permitidos por CORS, separados por coma
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Base de datos PostgreSQL (credenciales por variables de entorno con valores por defecto)
spring.datasource.url=jdbc:postgresql://localhost:5432/banktdea
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
